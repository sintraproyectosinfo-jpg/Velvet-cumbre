<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Cumbre Reserve Coffee</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #0b0b0b;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header-box {
            padding: 30px 10px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }
        .brand-title {
            font-size: 2em;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }
        .brand-sub {
            font-size: 0.9em;
            color: #bcaaa4;
            letter-spacing: 4px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .location {
            font-size: 0.8em;
            color: #888;
            letter-spacing: 1px;
        }
        .card {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px 20px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card h3 {
            font-size: 1.3em;
            color: #fff;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.4em;
            color: #d7ccc8;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            background-color: #4e342e;
            color: #ffffff;
            padding: 14px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95em;
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: #5d4037;
        }
        footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #666;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1 class="brand-title">Velvet Cumbre</h1>
        <div class="brand-sub">RESERVE COFFEE</div>
        <div class="location">EL SALVADOR • 1500 MSNM</div>
    </div>

    <div class="card">
        <h3>Plan Boutique</h3>
        <div class="price">$24.00 / mes</div>
        <a href="https://wa.me/50377902129 
text=Hola!%20Quisiera%20solicitar%20el%20Plan%20Boutique." class="btn">Solicitar Plan Boutique</a>
    </div>

    <div class="card">
        <h3>Plan Boutique Master</h3>
        <div class="price">$66.00 / mes</div>
        <a href="https://wa.me/50379005833?text=Hola!%20Quisiera%20solicitar%20el%20Plan%20Boutique%20Master." class="btn">Solicitar Plan Master</a>
    </div>

    <div class="card">
        <h3>Take-Home Pack</h3>
        <div class="price">$42.00</div>
        <a href="https://wa.me/50377902129?text=Hola!%20Quisiera%20encargar%20el%20Take-Home%20Pack." class="btn">Encargar Take-Home Pack</a>
    </div>

    <footer>
        &copy; 2026 Velvet Cumbre. Todos los derechos reservados.
    </footer>

</body>
</html>
